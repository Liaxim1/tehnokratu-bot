name: Weekly Tehnokratu draft

on:
  schedule:
    - cron: '0 10 * * 6'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-slim

    steps:
      - name: Wake Railway and start weekly draft
        env:
          RAILWAY_BOT_URL: ${{ secrets.RAILWAY_BOT_URL }}
          SCHEDULE_SECRET: ${{ secrets.SCHEDULE_SECRET }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_BOT_URL"
          test -n "$SCHEDULE_SECRET"

          curl --fail --silent --show-error \
            --max-time 30 \
            -X POST "$RAILWAY_BOT_URL/internal/weekly" \
            -H "X-Schedule-Secret: $SCHEDULE_SECRET" \
            -H "Content-Type: application/json"
